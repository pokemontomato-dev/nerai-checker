<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}*{box-sizing:border-box}</style>
</head>
<body>
<title>狙い目チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen chat. Header with machine count, scrolling log, sticky composer. Data-lamp style numerals. */
:root{
  --bg:#eef0f5; --panel:#ffffff; --ink:#1b1e2b; --mute:#646a80; --line:#d7dbe6;
  --accent:#d9480f; --accent-ink:#ffffff; --lamp:#c23a0a; --me:#1f2a52; --me-ink:#f3f5ff;
  --ok:#1f7a45; --ok-bg:#e3f4ea; --ng:#b4232c; --ng-bg:#fbe6e7; --maybe:#8a5a00; --maybe-bg:#fbf0d9;
  --display:"DotGothic16","Zen Kaku Gothic New",ui-monospace,monospace;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141d; --panel:#1b1e2b; --ink:#e8eaf2; --mute:#9aa0b8; --line:#2d3144;
  --accent:#ff7a3d; --accent-ink:#1b0d05; --lamp:#ff9a5c; --me:#3a4785; --me-ink:#f3f5ff;
  --ok:#5fd28f; --ok-bg:#16301f; --ng:#ff7a82; --ng-bg:#3a1a1e; --maybe:#f2c25b; --maybe-bg:#33290f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141d; --panel:#1b1e2b; --ink:#e8eaf2; --mute:#9aa0b8; --line:#2d3144;
  --accent:#ff7a3d; --accent-ink:#1b0d05; --lamp:#ff9a5c; --me:#3a4785; --me-ink:#f3f5ff;
  --ok:#5fd28f; --ok-bg:#16301f; --ng:#ff7a82; --ng-bg:#3a1a1e; --maybe:#f2c25b; --maybe-bg:#33290f;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:.04em;color:var(--lamp)}
header .sub{color:var(--mute);font-size:12px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;min-width:0}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);padding:8px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-break:break-word}
.bot{align-self:flex-start;display:flex;flex-direction:column;gap:10px;width:92%}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.bubble.dim{color:var(--mute)}
.machine{font-weight:700;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:500}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:8px;padding:4px 10px;font-size:15px;align-self:flex-start}
.v-ok{background:var(--ok-bg);color:var(--ok)} .v-ng{background:var(--ng-bg);color:var(--ng)} .v-maybe{background:var(--maybe-bg);color:var(--maybe)}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--mute);list-style:none}
.rows summary::-webkit-details-marker{display:none}
.rows summary::before{content:"▸ ";} .rows[open] summary::before{content:"▾ ";}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.06em}
td.aim{font-family:var(--display);color:var(--lamp);white-space:nowrap;font-size:15px}
tr.hit td{background:var(--ok-bg)} tr.hit td.aim{color:var(--ok)}
tr.near td{background:var(--maybe-bg)}
td.cond{min-width:9em}
@media (max-width:640px){
  table,tbody{display:block}
  tr:first-child{display:none}
  tr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;padding:8px 12px;border-top:1px solid var(--line)}
  td{display:block;border:0;padding:0;min-width:0}
  td.sec{grid-column:1/-1;min-width:0;font-size:11px}
  td.cond{min-width:0}
  td.aim{white-space:normal;text-align:right}
  td.note{grid-column:1/-1;margin-top:2px}
  td:empty{display:none}
  tr:has(td.aim:empty) td.cond{grid-column:1/-1}
  tr.hit,tr.near{background:var(--ok-bg)} tr.near{background:var(--maybe-bg)}
  tr.hit td,tr.near td{background:none}
}
td.sec{color:var(--mute);font-size:12px;min-width:7em}
.note{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--accent);outline:none}
form{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
#q{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#send{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;cursor:pointer}
#send:disabled{opacity:.5}
#send:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.foot{font-size:11px;color:var(--mute);padding:0 16px 6px}
</style>

<div class="app">
  <header>
    <h1>狙い目チェッカー</h1>
    <span class="sub" id="count"></span>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="foot" id="mode">期待値（円・枚）は表に無いので出しません。G数は断りが無ければデータランプ基準です。</div>
  <form id="f" autocomplete="off">
    <input id="q" name="q" placeholder="例：沖ドキGOLD リセ 2スルー 初当たり120 今250G" aria-label="台の状況">
    <button id="send" type="submit">判定</button>
  </form>
</div>


<style>
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#lock form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#lock h2{font-family:var(--display);font-weight:400;color:var(--lamp);margin:0;font-size:20px}
#lock p{margin:0;color:var(--mute);font-size:13px}
#lock input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#lock button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
#lock .err{color:var(--ng);font-size:13px;min-height:1.2em}
</style>
<div id="lock"><form id="lf" autocomplete="off">
  <h2>狙い目チェッカー</h2><p>パスワードを入力してください</p>
  <input id="pw" type="password" aria-label="パスワード" autocomplete="current-password">
  <button type="submit">開く</button><div class="err" id="lerr" aria-live="polite"></div>
</form></div>

<script id="app" type="text/plain">const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const log = $('#log');
$('#count').textContent = `スマスロ ${DATA.filter(m=>m.t==='スマスロ').length}機種・メダル機 ${DATA.filter(m=>m.t!=='スマスロ').length}機種`;

const norm = s => (s||'').normalize('NFKC').toLowerCase().replace(/[\s・\-_.。、○〇]/g,'');
// machine keys: full name, sheet name, name without L/S prefix
DATA.forEach(m => {
  const keys = new Set([norm(m.n), norm(m.s), ...(m.a||[]).map(norm)]);
  const bare = norm(m.n).replace(/^[ls](?=\S)/,''); if (bare.length>=2) keys.add(bare);
  m.keys = [...keys].filter(k=>k.length>=2);
});
function lcs(a,b){ // longest common substring length
  let best=0; const dp=new Array(b.length+1).fill(0);
  for(let i=1;i<=a.length;i++){ let prev=0;
    for(let j=1;j<=b.length;j++){ const t=dp[j]; dp[j]= a[i-1]===b[j-1]? prev+1:0; if(dp[j]>best)best=dp[j]; prev=t; } }
  return best;
}
function findMachines(q){
  const nq = norm(q);
  const scored = DATA.map(m => {
    let s=0;
    for(const k of m.keys){ if(nq.includes(k)) s=Math.max(s,k.length+100); else { const l=lcs(nq,k); if(l>=2 && l>=Math.min(3,k.length)) s=Math.max(s,l + l/k.length); } }
    return {m,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  return scored;
}

// ---- simple local reading of the situation ----
function parseSituation(q, m){
  let t = q.normalize('NFKC');
  // drop the machine name so digits in it (炎炎2, 乙女5) are not read as G数
  if (m) for (const k of [m.n, m.s, ...(m.a||[])].map(x=>(x||'').normalize('NFKC')).filter(x=>x.length>=2).sort((a,b)=>b.length-a.length)){
    const i = t.toLowerCase().indexOf(k.toLowerCase()); if (i>=0){ t = t.slice(0,i)+' '+t.slice(i+k.length); break; }
  }
  const num = re => { const m=t.match(re); return m? +m[1] : null; };
  return {
    q: norm(q),
    reset: /リセ|朝イチ|朝一|朝1(?!回)/.test(t) && !/据え?置き?(?!なし)/.test(t),
    thru: num(/(\d+)\s*スルー/),
    first: num(/(?:初当た?り|朝(?:1|イチ|一)(?:回目)?(?:の当た?り)?)\s*(\d+)/),
    yuri: num(/有利(?:区間)?(?:間)?\s*(\d+)/) ?? num(/天国間\s*(\d+)/),
    now: num(/(?:今|現在|いま)\s*(\d+)/) ?? num(/(?:液晶|CZ間|AT間|ボーナス間)\s*(\d+)/) ?? (()=>{ const all=[...t.matchAll(/(\d+)\s*(?:[gG]|pt|PT)/g)]; return all.length? +all[all.length-1][1] : null; })() ?? bareNum(t),
  };
}
// last number that is not a スルー/初当たり/有利/差枚 value, e.g. "ミリゴリセ500" -> 500
function bareNum(t){
  const s = t.replace(/\d+\s*(?:スルー|回|連|枚|%|周期)/g,' ').replace(/(?:初当た?り|朝(?:1|イチ|一)(?:回目)?(?:の当た?り)?|有利(?:区間)?(?:間)?|天国間|差枚)\s*[-+]?\d+/g,' ').replace(/[-+]\d+/g,' ');
  const all = [...s.matchAll(/\d+/g)]; return all.length ? +all[all.length-1][0] : null;
}
// "700〜" -> [[700,Inf]], "液晶280〜300 / 液晶490〜" -> [[280,300],[490,Inf]], "210-300" -> [[210,300]]
const aimRanges = a => (a||'').normalize('NFKC').split('/').map(seg=>{
  const m = seg.match(/(\d+)\s*G?\s*(?:([〜~\-ー－])\s*(\d+)?)?/); if(!m) return null;
  return [+m[1], m[3]!=null ? +m[3] : Infinity];
}).filter(Boolean);
const inRange = (rs,n) => rs.some(([a,b])=>n>=a && n<=b);
function judgeLocal(m, sit){
  const isMorning = r => /朝|設定変更後|リセット/.test((r[0]+' '+r[1]).replace(/朝イチ以外/g,''));
  let rows = m.r.map((r,i)=>({r,i})).filter(x=>x.r[3]);
  const hasMorning = rows.some(x=>isMorning(x.r));
  // sections that are explicitly "ここから朝イチ当たりは不問" stay valid for both
  rows = rows.filter(x => {
    const morn = isMorning(x.r) || (/朝イチ当たりは不問/.test(x.r[0]));
    if (/朝イチ当たりは不問/.test(x.r[0])) return true;
    return sit.reset ? (hasMorning ? morn : true) : !morn;
  });
  rows = rows.filter(x => {
    const txt = (x.r[0]+' '+x.r[1]+' '+x.r[2]).normalize('NFKC');
    const th = txt.match(/(\d+)\s*スルー(\s*以降)?/);
    if (th && sit.thru!=null){ const n=+th[1]; if (th[2] ? sit.thru<n : sit.thru!==n) return false; }
    if (th && sit.thru==null) return false;
    const fl = x.r[0].normalize('NFKC').match(/当たりが(\d+)G?(以下|以上)/);
    if (fl && sit.first!=null){ const n=+fl[1]; if (fl[2]==='以下'? sit.first>n : sit.first<n) return false; }
    return true;
  });
  const res = rows.map(x=>{
    const cond = (x.r[1]+' '+x.r[2]).normalize('NFKC');
    const ym = cond.match(/有利区間\s*(\d+)G?\s*以上/);
    let needs=null;
    if (ym){ if (sit.yuri==null) needs='有利区間'; else if (sit.yuri<+ym[1]) return null; }
    else {
      const rest = norm(cond.replace(/\d+\s*スルー(\s*以降)?/g,'').replace(/(スルー)?不問/g,'').replace(/\//g,''));
      const key = rest.replace(/[\d\-~〜+()（）]/g,'').replace(/^g/,'').slice(0,3);
      if (rest && !/^(リセ|朝イチ|朝一|据え?置|設定変更後)/.test(rest) && !(key && sit.q.includes(key))) needs = rest;
    }
    const rs = aimRanges(x.r[3]);
    const a = rs.length ? Math.min(...rs.map(r=>r[0])) : null;
    const nextA = sit.now==null ? null : (rs.map(r=>r[0]).filter(v=>v>sit.now).sort((p,q)=>p-q)[0] ?? null);
    return {i:x.i, a, nextA, needs, ok: rs.length>0 && sit.now!=null && inRange(rs, sit.now)};
  }).filter(Boolean);
  const sure = res.filter(x=>!x.needs);
  let verdict = 'maybe';
  if (sit.now!=null && sure.length){ verdict = sure.some(x=>x.ok) ? 'ok' : (res.some(x=>x.needs && x.ok) ? 'maybe' : 'ng'); }
  const okRow = sure.find(x=>x.ok);
  const nextRow = sure.filter(x=>x.nextA!=null).sort((p,q)=>p.nextA-q.nextA)[0];
  const okRows = sure.filter(x=>x.ok);
  return {verdict, okRow, okRows, nextRow, hits:new Set(sure.map(x=>x.i)), near:new Set(res.filter(x=>x.needs).map(x=>x.i))};
}

// ---- rendering ----
function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function scroll(){ log.scrollTop = log.scrollHeight; }
function addMe(t){ log.append(el('div','msg me',t)); scroll(); }
function addBot(){ const b=el('div','msg bot'); log.append(b); scroll(); return b; }
const VLABEL = {ok:['v-ok','打てる'], ng:['v-ng','打てない'], maybe:['v-maybe','条件次第']};
function verdictEl(v){ const [c,l]=VLABEL[v]; return el('span','verdict '+c,l); }

function tableEl(m, hits, near, openAll){
  const d = el('details','rows'); if (openAll) d.open = true;
  const rowsWithAim = m.r.filter(r=>r[3]).length;
  d.append(el('summary',null,`${m.n} のボーダー表（狙い目 ${rowsWithAim}行）`));
  const wrap = el('div','tbl'); const t = el('table');
  const hd = el('tr'); ['区分','条件','狙い目','補足'].forEach(h=>hd.append(el('th',null,h))); t.append(hd);
  m.r.forEach((r,i)=>{
    const tr = el('tr', hits&&hits.has(i)?'hit':(near&&near.has(i)?'near':''));
    tr.append(el('td','sec',r[0]), el('td','cond',[r[1],r[2]].filter(Boolean).join(' / ')), el('td','aim',r[3]), el('td','note',r[4]));
    t.append(tr);
  });
  wrap.append(t); d.append(wrap); return d;
}
function machineLine(m){ const d=el('div','machine'); d.append(el('span',null,m.n), el('span','tag',m.t)); return d; }

// ---- Claude ----
let sample = null;
(async()=>{ try{ sample = await window.claude?.use?.('sample') ?? null; }catch{ sample=null; }
  $('#mode').textContent = sample
    ? '判定はボーダー表をもとにClaudeが行います。期待値（円・枚）は表に無いので出しません。'
    : '簡易判定モード（表の条件を機械的に照合）。期待値（円・枚）は表に無いので出しません。';
})();
const history = []; // {role, content}
function rowsTsv(m){ return m.r.map(r=>r.map(c=>(c||'').replace(/\s+/g,' ')).join(' | ')).join('\n'); }
function rules(m){
  return `あなたはパチスロの「狙い目G数ボーダー表」を参照して、台を打つべきか判定するアシスタントです。
以下はユーザー自身が作成したボーダー表のうち「${m.n}」(${m.t}) の全行です。各行は「区分 | 条件1 | 条件2 | 狙い目 | 補足」。
表の約束：特に断りが無ければG数はデータランプ基準。「朝イチ」「リセ」はリセット（設定変更後）台のこと。入力は「ミリゴリセ500」のように機種の略称と条件がくっついた短い形でも来る（この例は ミリゴ・設定変更後・今500G）。単位の無い数字は今のG数として読む。「700〜」は700G以上なら打てるという意味。「液晶」「CZ間」など単位が書いてある値はその単位で比べる。条件1が空や「不問」の行は条件なし。
---
${rowsTsv(m)}
---
ユーザーの台の状況を読んで判定してください。
・1行目は必ず【打てる】【打てない】【条件次第】のどれか1つだけ。
・続けて、根拠にした表の行（区分・条件・狙い目）と、今のG数との差を短く書く。あと何Gで狙い目か、も書く。
・状況から分からない条件（有利区間G数、前回差枚など）で結論が変わるなら【条件次第】にして、何を確認すれば決まるかを書く。
・ヤメ時など打った後に役立つ行があれば一言添える。
・期待値（円・枚・機械割）は表に無いので絶対に推測で出さない。表に無いことは「表に記載なし」と言う。
・日本語、全体で6行以内、Markdown記号（#や**や表）は使わない。`;
}
let ctl = null;

async function askMachineByClaude(q){
  if (!sample) return null;
  try{
    const names = DATA.map(m=>m.n).join('\n');
    const r = await sample.json(`次はパチスロの機種名リストです。\n${names}\n\nユーザーの入力「${q}」が指している機種をリストから選び、{"name": "リスト内の機種名"} だけを返してください。該当なしなら {"name": null}。略称や通称も考慮すること。`, {modelTier:'quick'});
    return DATA.find(m=>m.n===r?.name) || null;
  }catch{ return null; }
}

let current = null;
async function handle(q){
  addMe(q);
  const bot = addBot();
  let m = null;
  const found = findMachines(q);
  if (found.length && (found[0].s>=100 || found.length===1 || found[0].s - (found[1]?.s||0) >= 1)) m = found[0].m;
  if (!m && found.length===0 && current && /\d/.test(q)) m = current; // follow-up like "今300Gなら？"
  if (!m){
    const wait = el('div','bubble dim','機種を探しています…'); bot.append(wait); scroll();
    m = await askMachineByClaude(q);
    wait.remove();
  }
  if (!m){
    const b = el('div','bubble', found.length ? '機種を絞り込めませんでした。どれですか？' : '機種名が見つかりませんでした。表にある機種名か略称を入れてください。');
    bot.append(b);
    const chips = el('div','chips');
    (found.length? found.slice(0,8).map(x=>x.m) : DATA.slice(0,0)).forEach(mm=>{
      const c = el('button','chip',mm.n); c.type='button';
      c.onclick = ()=>{ $('#q').value = mm.n + ' ' + q; $('#q').focus(); };
      chips.append(c);
    });
    bot.append(chips); scroll(); return;
  }
  if (m !== current){ history.length = 0; current = m; }
  bot.append(machineLine(m));
  const sit = parseSituation(q, m);
  const local = judgeLocal(m, sit);
  const hasNumbers = sit.now!=null || sit.thru!=null;

  if (sample && hasNumbers){
    const b = el('div','bubble dim','表と照らし合わせています…'); bot.append(b);
    bot.append(tableEl(m, local.hits, local.near, false)); scroll();
    ctl = new AbortController();
    const turns = [{role:'user',content:rules(m)}, ...history.slice(-6), {role:'user',content:'台の状況：'+q}];
    try{
      const {text} = await sample(turns, {cache:false, signal:ctl.signal, onText:({text})=>{ b.classList.remove('dim'); renderAnswer(b,text); scroll(); }});
      renderAnswer(b,text);
      history.push({role:'user',content:'台の状況：'+q},{role:'assistant',content:text});
    }catch(e){
      if (e?.code==='not_granted' || e?.code==='sampling_disabled' || e?.code==='capability_disabled'){ sample=null; $('#mode').textContent='簡易判定モード（表の条件を機械的に照合）。期待値（円・枚）は表に無いので出しません。'; }
      b.replaceWith(localAnswer(m, sit, local, e?.code==='rate_limited' ? '混み合っているので簡易判定に切り替えました。' : 'Claudeに聞けなかったので簡易判定です。'));
    }
  } else if (hasNumbers){
    bot.append(localAnswer(m, sit, local));
    bot.append(tableEl(m, local.hits, local.near, false));
  } else {
    bot.append(el('div','bubble',`${m.n} の狙い目です。今のG数やスルー回数も一緒に入れると判定します。`));
    bot.append(tableEl(m, null, null, true));
  }
  scroll();
}
function renderAnswer(b, text){
  b.textContent='';
  const clean = text.replace(/\*\*/g,'').trim();
  const m = clean.match(/^【(打てる|打てない|条件次第)】\s*/);
  if (m){ const v = {打てる:'ok',打てない:'ng',条件次第:'maybe'}[m[1]]; b.append(verdictEl(v), document.createElement('br')); b.append(clean.slice(m[0].length)); }
  else b.append(clean);
}
const rowLabel = r => [r[0], r[1], r[2]].filter(Boolean).join(' / ') + ' → ' + r[3];
function localAnswer(m, sit, local, prefix){
  const b = el('div','bubble');
  b.append(verdictEl(sit.now==null?'maybe':local.verdict), document.createElement('br'));
  const lines = [];
  if (prefix) lines.push(prefix);
  const read = [sit.reset?'リセ':null, sit.thru!=null?`${sit.thru}スルー`:null, sit.first!=null?`初当たり${sit.first}G`:null, sit.yuri!=null?`有利区間${sit.yuri}G`:null, sit.now!=null?`今${sit.now}G`:null].filter(Boolean).join('・');
  lines.push('読み取った条件：' + (read || 'なし'));
  if (sit.now==null) lines.push('今のG数が分からないので判定できません。');
  else if (local.okRow) lines.push(local.okRows.slice(0,4).map(x=>'該当：'+rowLabel(m.r[x.i])).join('\n') + `\n今${sit.now}Gは狙い目の範囲内です。`);
  else if (local.nextRow) lines.push(`該当：${rowLabel(m.r[local.nextRow.i])}\nあと ${local.nextRow.nextA-sit.now}G で狙い目です。`);
  else if (local.hits.size) lines.push('該当する行の狙い目の範囲外です。下の表を確認してください。');
  else lines.push('条件に合う行を特定できませんでした。下の表を確認してください。');
  if (local.near.size) lines.push('黄色の行は追加条件付き（有利区間・前回差枚など）なので自分で確認してください。');
  b.append(lines.join('\n')); return b;
}

$('#f').addEventListener('submit', e=>{
  e.preventDefault();
  const q = $('#q').value.trim(); if (!q) return;
  $('#q').value=''; handle(q);
});

// opening state
(function intro(){
  const bot = addBot();
  bot.append(el('div','bubble','機種名と台の状況を送ると、ボーダー表の狙い目G数と照らして打てるか判定します。\n例：「ミリゴリセ500」「沖ドキGOLD リセ 2スルー 初当たり120 今250G」「アカメ 650G」「一方通行 駆け抜け後 液晶300」'));
  const chips = el('div','chips');
  ['ミリゴリセ500','沖ドキGOLD リセ 2スルー 初当たり120 今250G','アカメ 有利差枚700枚 600G'].forEach(s=>{
    const c = el('button','chip',s); c.type='button'; c.onclick=()=>handle(s); chips.append(c);
  });
  bot.append(chips);
})();
</script>
<script>
(()=>{
  const L=JSON.parse(document.getElementById('lockdata').textContent), d=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
  async function open(pw){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(L.s),iterations:L.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const txt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(L.i)},key,d(L.c)));
    document.getElementById('data').textContent=txt;
    const s=document.createElement('script'); s.textContent=document.getElementById('app').textContent; document.body.append(s);
    document.getElementById('lock').remove();
  }
  const f=document.getElementById('lf'), err=document.getElementById('lerr');
  f.addEventListener('submit',async e=>{e.preventDefault(); const pw=document.getElementById('pw').value; err.textContent='確認中…';
    try{ await open(pw); try{localStorage.setItem('nerai-pw',pw)}catch(_){} }catch(_){ err.textContent='パスワードが違います'; }});
  let saved=null; try{saved=localStorage.getItem('nerai-pw')}catch(_){}
  if(saved) open(saved).catch(()=>{try{localStorage.removeItem('nerai-pw')}catch(_){}});
  else document.getElementById('pw').focus();
})();
</script>
